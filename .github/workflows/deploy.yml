name: Deploy to GitHub Pages

on:
    push:
        branches:
            - master
    # Lets a failed or stale deploy be re-run from the Actions tab.
    workflow_dispatch:

permissions:
    contents: read

# One deploy at a time; a newer push supersedes a build still in flight.
concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: 'npm'
            - name: Install dependencies
              run: npm ci
            - name: Build website
              run: npm run build
            - name: Upload artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: ./build

    publish:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
